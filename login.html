<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <title>Página de Login</title>
 
    <!-- CSS: aparência da página -->
    <style>
        * {
            box-sizing: border-box;
        }
 
        body {
    font-family: Arial, sans-serif;
    background: url("imagens/capa.png"),
                url("imagens/ruido.png"),
                linear-gradient(50deg, #ff4169, #7c26f8);
    background-attachment: fixed;
    background-size: cover;
    background-position: center;
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}
 
     .container {
    background: rgba(255, 255, 255, 0.20);
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(8px);
    color: white;
}
 
        h1 {
    text-align: center;
    color: white;
    margin-bottom: 10px;
    }

    .logo-spotify {
    display: block;
    width: 150px;
    height: auto;
    margin: 0 auto 20px;
}
 
        .subtitulo {
    text-align: center;
    color: #eeeeee;
    margin-bottom: 25px;
}
 
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }
 
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
        }
 
        input:focus {
            outline: 2px solid #2878d0;
            border-color: #2878d0;
        }
 
        .opcoes {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            font-size: 14px;
        }
 
        .opcoes input {
            width: auto;
        }
 
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: none;
            border-radius: 6px;
            background: #7c25f8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
 
        button:hover {
            background: #6707e3;
        }
 
        #mensagem {
            margin-top: 16px;
            text-align: center;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
 
         .erro {
         color: #ffb3c1;
       }

         .sucesso {
         color: #ffffff;
        }
 
        .rodape {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 20px;
        }
    </style>
</head>
 
<body>
 
    <main class="container">

        <img src="imagens/spotify.svg" alt="Logo do Spotify" class="logo-spotify">
 
        <h1>Bem-vindo!</h1>
 
        <p class="subtitulo">
            Entre com seus dados para continuar.
        </p>
 
        <!-- Formulário de login -->
        <form id="formLogin">
 
            <label for="email">E-mail</label>
 
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                autocomplete="username"
                required
            >
 
            <label for="senha">Senha</label>
 
            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                required
            >
 
            <div class="opcoes">
                <input type="checkbox" id="mostrarSenha">
                <label for="mostrarSenha" style="margin: 0;">
                    Mostrar senha
                </label>
            </div>
 
            <button type="submit">Entrar</button>
 
            <p id="mensagem" role="status" aria-live="polite"></p>
 
        </form>
 
        <p class="rodape">
            Página desenvolvida para fins educacionais.
        </p>
 
    </main>
 
    <!-- JavaScript: comportamento da página -->
    <script>
        // Localizar os elementos HTML
        const formulario = document.getElementById("formLogin");
        const campoEmail = document.getElementById("email");
        const campoSenha = document.getElementById("senha");
        const mostrarSenha = document.getElementById("mostrarSenha");
        const mensagem = document.getElementById("mensagem");
 
        // Mostrar ou ocultar a senha
        mostrarSenha.addEventListener("change", function() {
            if (mostrarSenha.checked) {
                campoSenha.type = "text";
            } else {
                campoSenha.type = "password";
            }
        });
 
        // Executar quando o formulário for enviado
        formulario.addEventListener("submit", function(event) {
 
            // Impedir o envio e a recarga automática da página
            event.preventDefault();
 
            //  Obter os valores digitados
            let email = campoEmail.value.trim();
            let senha = campoSenha.value;
 
            // Limpar mensagens anteriores
            mensagem.textContent = "";
            mensagem.className = "";
 
            //  Verificar se os campos estão preenchidos
            if (email === "" || senha.trim() === "") {
                mensagem.textContent = "Preencha todos os campos.";
                mensagem.className = "erro";
                return;
            }
 
            //  Verificar o formato básico do e-mail
            if (!campoEmail.validity.valid) {
                mensagem.textContent = "Digite um e-mail válido.";
                mensagem.className = "erro";
                return;
            }
 
            //  Exibir uma resposta demonstrativa
            mensagem.textContent =
                "Dados validados! Login demonstrativo concluído.";
 
            mensagem.className = "sucesso";
 
        });
    </script>
 
</body>
</html>
